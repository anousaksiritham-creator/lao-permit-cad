name: Live plan offline tests
on:
  push:
    paths: ['tools/live_plan/**', 'tests/**', 'examples/live-plan/**', '.github/workflows/live-plan-tests.yml']
  pull_request:
    paths: ['tools/live_plan/**', 'tests/**', 'examples/live-plan/**', '.github/workflows/live-plan-tests.yml']
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m tools.live_plan prepare examples/live-plan/source.synthetic.json --config examples/live-plan/config.synthetic.json --work .live-runs/prepared
